version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sgs_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executa automaticamente o script de criação de tabelas
      - ./init-scripts:/docker-entrypoint-initdb.d

  web:
    build: .
    container_name: sgs_flask_api
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  pgdata:
