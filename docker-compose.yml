version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sgs_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sgs_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executa automaticamente o script de criação de tabelas
      - ./init-scripts:/docker-entrypoint-initdb.d

  web:
    build: .
    container_name: sgs_flask_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/sgs_db
      - SECRET_KEY=sua_chave_secreta_super_segura
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  pgdata:
