version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sgs_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: sgs_flask_api
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # Dentro da rede do compose o banco atende pelo nome do serviço.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  pgdata:
